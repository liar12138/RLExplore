[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlexplore"
version = "0.1.0"
description = "Observation-only active placement with a frozen SONIC controller"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.2", "mjlab>=1.5,<1.6", "mujoco>=3.10,<3.11", "mujoco-warp==3.10.0.1", "onnxruntime>=1.20", "gymnasium>=1.0", "PyYAML>=6", "Pillow>=10"]

[project.scripts]
rlexplore = "rlexplore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
